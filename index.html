<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body id="top">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top">Simple Shop</a>
      <nav class="nav">
        <a href="#top">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">The Everyday Collection</p>
        <h1>Everyday essentials, simply priced.</h1>
        <p class="hero-tagline">Browse our hand-picked selection of quality products.</p>
        <a class="button" href="#products">Shop now</a>
      </div>
    </section>

    <section id="products" class="products">
      <div class="container">
        <h2>Featured products</h2>
        <p id="products-status" class="status" hidden></p>
        <div id="product-grid" class="product-grid"></div>
      </div>
    </section>
  </main>

  <footer id="contact" class="site-footer">
    <div class="container">
      <p>© 2026 Simple Shop. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
